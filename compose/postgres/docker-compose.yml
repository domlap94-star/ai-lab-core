services:
  postgres:
    # Pinned to the exact image running during the CHUNK 17 checkpoint.
    image: postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d

    container_name: postgres

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    environment:
      POSTGRES_DB: ai_lab
      POSTGRES_USER: ai_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the untracked runtime environment}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - ../../data/postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_lab"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ai-lab-network

networks:
  ai-lab-network:
    external: true
