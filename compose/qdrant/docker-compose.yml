services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant

    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"

    volumes:
      - ../../data/qdrant:/qdrant/storage

    networks:
      - ai-lab-network

networks:
  ai-lab-network:
    external: true
