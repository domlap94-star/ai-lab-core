services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      - TZ=Europe/Warsaw
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http

      # Maksymalny rozmiar requestu przyjmowanego przez n8n, w MB.
      # 128 MB daje zapas dla załącznika 28,4 MB i narzutu multipart/JSON.
      - N8N_PAYLOAD_SIZE_MAX=128

      # Duże dane binarne zapisuj na dysku zamiast trzymać je w pamięci.
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_AVAILABLE_BINARY_DATA_MODES=filesystem

      # Usuwa niegroźne ostrzeżenie wynikające z montowania wolumenu z Windows.
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false

      # Zachowujemy obecny limit task runnera jawnie.
      - N8N_RUNNERS_TASK_TIMEOUT=300

    volumes:
      - ../../data/n8n:/home/node/.n8n

    networks:
      - ai-lab-network

networks:
  ai-lab-network:
    external: true