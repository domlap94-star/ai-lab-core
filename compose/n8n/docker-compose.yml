services:
  n8n:
    # n8n 2.31.6; same digest as the current production workflow runtime.
    image: docker.n8n.io/n8nio/n8n@sha256:3c07c723326dd72e46a6969181c66a75260b7a204b9b77ba1ece6d594489c684
    container_name: n8n
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    ports:
      - "127.0.0.1:5678:5678"

    environment:
      - TZ=Europe/Warsaw
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http

      - N8N_PAYLOAD_SIZE_MAX=128

      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_AVAILABLE_BINARY_DATA_MODES=filesystem

      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false

      - N8N_RUNNERS_TASK_TIMEOUT=300

    volumes:
      - ../../data/n8n:/home/node/.n8n

    networks:
      - ai-lab-network

networks:
  ai-lab-network:
    external: true
