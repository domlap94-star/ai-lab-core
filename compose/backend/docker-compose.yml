services:
  backend:
    container_name: ai-lab-backend

    build:
      context: ../../backend

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - ../../.env

    environment:
      VISION_AUTOMATION_ENABLED: "true"
      KNOWLEDGE_BASE_PROCESSING_ENABLED: "true"
      KNOWLEDGE_BASE_VECTOR_WRITES_ENABLED: "true"
      ADVANCED_ANALYSIS_ENABLED: "true"
      DOCUMENT_PREPARATION_ENABLED: "true"

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ../../backend:/app
      - ../../data:/data

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - ai-lab-network

networks:
  ai-lab-network:
    external: true
