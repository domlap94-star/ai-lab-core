services:
  open-webui:
    # Revision ecd48e2f718220a6400ecf49eafd4867a38feb10; do not follow main.
    image: ghcr.io/open-webui/open-webui@sha256:a26effeb220e132482bf7e0560b3404843e7bc40d23051144e062960df8df6b0
    container_name: open-webui
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    ports:
      - "127.0.0.1:3000:8080"

    environment:
      - OLLAMA_BASE_URL=http://ollama:11434

    volumes:
      - ../../data/openwebui:/app/backend/data

    networks:
      - ai-lab-network

networks:
  ai-lab-network:
    external: true
